# Automated safeguards on pull requests. GitHub checks Python syntax and then
# runs the offline unit tests; nothing here connects to Discord or Shopify.
name: Test GuildKeeper

on:
  pull_request:
    # Only code changes matching these paths trigger this workflow.
    paths:
      - "bot.py"
      - "*.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  rank-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Set up the same Python dependencies the Oracle bot uses.
      - name: Install bot dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile bot.py
      # All test_*.py files run, including Shopify, quests, admin and scheduling.
      - name: Test onboarding and XP ranks
        run: python -m unittest discover -s tests -v
